<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="bada of alcohol">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="alcohol">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <title>alcohol</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --splash-bg: #ffffff;
      --splash-fg: #E63946;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --splash-bg: #1a1a1a;
        --splash-fg: #E63946;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--splash-bg);
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: var(--splash-bg);
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    #splash .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(230, 57, 70, 0.2);
      border-top-color: var(--splash-fg);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #splash .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: var(--splash-fg);
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- 즉시 표시되는 로딩 스플래시 — Flutter 첫 프레임에서 제거됨 -->
  <div id="splash">
    <div class="spinner"></div>
    <div class="label">잔을 준비하는 중…</div>
  </div>

  <script>
    // Flutter 엔진이 첫 프레임을 그리면 스플래시 제거
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hide');
        setTimeout(function () { splash.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
